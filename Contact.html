<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Title</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Pinyon+Script&display=swap');
        :root{
           --thrme-color: #2fffff;
           --base-color:#fff;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body{
            font-family: "Noto Sans", sans-serif;
            background: rgb(43, 43, 43);
            overflow-x: hidden;
        }
        nav{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            width: 95vw;
            height: 10vh;
            user-select: none;
        }
        .container{
            width: 90%;
            height: 8vh;
            display: flex;
            justify-content: center;
            border-radius: 5px;
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: transparent;
            border-radius: 5px;
        }
        .logo a{
            font-family: sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            background: linear-gradient(120deg, var(--thrme-color), var(--base-color), var(--base-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            transition-duration: 0.5s;
        }
        .logo a:hover{
            background: linear-gradient(120deg, var(--thrme-color),var(--thrme-color), var(--base-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .navbar .pages{
            width: 60%;
            display: flex;
            justify-content: space-between;
        }
        .pages a{
            position: relative;
            color: var(--base-color);
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.2rem;
            transition-duration: 0.5s;
            letter-spacing: 1.5px;
        }
        .pages a:hover{
            color: var(--thrme-color);
        }
        .pages a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 100%;
    height: 2px;
    background-color: var(--thrme-color);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.4s ease;
}

.pages a:hover::after {
    transform: scaleX(1);
}
.contact-box {
  backdrop-filter: blur(1000px);
  -webkit-backdrop-filter: blur(12px);
  margin: 3rem auto;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0px 20px rgb(4, 226, 255);
  max-width: 500px;
  width: 100%;
  direction: ltr;
  opacity: 0;
  transform: scale(0.5);
  animation: fadeInUp 0.8s forwards;
    }
    
@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.contact-box h2 {
  text-align: center;
  color: #ffffff;
  margin-bottom: 20px;
}

.contact-box label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  color: #ffffff;
}

.contact-box input,
.contact-box textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 1px solid rgba(255, 255, 255, 0.5); 
  border-radius: 10px;
  font-size: 14px;
  background: transparent; 
  color: #ffffff; 
}

.contact-box input::placeholder,
.contact-box textarea::placeholder {
  color: rgba(255, 255, 255, 0.7);
}

.contact-box textarea {
  height: 120px;
  resize: none;
}

.contact-box button {
  width: 100%;
  padding: 12px;
  background: #3498db;
  border: none;
  color: #ffffff;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.contact-box button:hover {
  background: var(--thrme-color);
}

#success-message {
  display: none;
  text-align: center;
  color: #00bd00;
  margin-top: 10px;
}
@media (max-width: 1200px){
    .navbar .pages{
            width: 80%;
        }
}
@media (max-width: 768px) {

    .container {
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container .navbar {
        width: 90%;
        display: inline;
    }
    .container .navbar .logo{
        display: flex;
        justify-content: center;
        height: 6vh;
    }
    .container .navbar .pages {
        width: 90%;
        font-size: 1em;
    }
    .container .navbar .pages  a{
        font-size: 1em;
    }


    
}
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="navbar">
            <div class="logo"><a href="https://networks0.github.io/"><span>netw</span>orks</a></div>
            <div class="pages">
                <a href="Articles.html">Articles</a>
                <a href="About.html">About</a>
                <a href="Contact.html">Contact</a>
                <a href="Privacy Policy.html">Privacy Policy</a>
            </div>
        </div>
        </div>
    </nav>

   <div class="contact-box">
  <h2 style="color: #fff;font-size: 2rem;">Contact Us</h2>
  <form id="contact-form">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name..." required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="example@email.com" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Write your message..." required></textarea>

    <button type="submit">Send</button>
  </form>
  <p id="success-message">Your message has been sent successfully! Thank you for contacting us.</p>
</div>

<script>
const form = document.getElementById('contact-form');
const successMessage = document.getElementById('success-message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData(form);

  const response = await fetch('https://formspree.io/f/mblavpkl', { 
    method: 'POST', 
    body: formData,
    headers: { 'Accept': 'application/json' }
  });

  if (response.ok) {
    successMessage.style.display = 'block';
    form.reset();
  } else {
    alert('An error occurred! Please try again.');
  }
});
</script>

</body>
</html>
