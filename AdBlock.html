<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #adblock-banner {
  position: fixed;
  bottom: -120px;
  left: 0;
  width: 100%;
  background: rgba(15, 15, 20, 0.95);
  color: #fff;
  padding: 12px;
  font-family: Arial;
  transition: bottom 0.4s ease;
  z-index: 9999;
}

#adblock-banner.show {
  bottom: 0;
}

.ab-content {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.ab-actions button {
  margin-left: 8px;
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#ab-help {
  background: #444;
  color: white;
}

#ab-continue {
  background: #00c853;
  color: white;
}
  </style>
</head>
<body>
  <div id="adblock-banner" role="region" aria-label="Adblock notice">
    <div class="ab-content">
      <span>
        🚫 نلاحظ أنك تستخدم مانع إعلانات — هذا الموقع يعتمد على الإعلانات للاستمرار
      </span>
  
      <div class="ab-actions">
        <button id="ab-help">كيف أوقفه</button>
        <button id="ab-continue">المتابعة بدون دعم</button>
      </div>
    </div>
  </div>
  <script>
    function detectAdBlock() {
      let ad = document.createElement("div");
      ad.className = "adsbox";
      ad.style.height = "1px";
      document.body.appendChild(ad);

      setTimeout(() => {
        if (ad.offsetHeight === 0) {
          document.getElementById("adblock-popup").style.display = "flex";
        } else {
          document.getElementById("adblock-popup").style.display = "none";
        }
        ad.remove();
      }, 100);
    }

    window.onload = detectAdBlock;
  </script>
</body>
</html>
